server {
    # IP of Webby-Soft SRL.
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;
    server_tokens off;

    # Client IP chain (audit A-48): Caddy, the TLS edge, sets X-Forwarded-For to the
    # client address; nginx appends Caddy's address. Django reads the client from the
    # right with TRUSTED_PROXY_COUNT=2, so values the client sends are never used.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # The Django admin is not served outside local development (audit A-52):
    # /admin/django/ falls through to the app like any other unknown path.

    location /static/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        include /etc/nginx/snippets/banxum-security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
