components:
  schemas:
    AccountAccessChangeRequest:
      type: object
      properties:
        new_status:
          $ref: '#/components/schemas/NewStatusEnum'
        reason_code:
          $ref: '#/components/schemas/AccountAccessChangeRequestReasonCodeEnum'
        note:
          type: string
        evidence_summary:
          type: string
        clean_account_confirmed:
          type: boolean
          default: false
      required:
      - new_status
      - reason_code
    AccountAccessChangeRequestReasonCodeEnum:
      enum:
      - kyc_aml_review
      - compliance_hold
      - email_recovery
      - support_request
      - account_closure
      - admin_correction
      - other
      type: string
      description: |-
        * `kyc_aml_review` - KYC/AML review
        * `compliance_hold` - Compliance hold
        * `email_recovery` - Email recovery
        * `support_request` - Support request
        * `account_closure` - Account closure
        * `admin_correction` - Admin correction
        * `other` - Other
    AccountAccessChangeResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        event:
          $ref: '#/components/schemas/AccountAccessEvent'
      required:
      - event
      - user
    AccountAccessEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        actor_user_id:
          type: string
          format: uuid
        actor_account_type:
          type: string
        previous_status:
          type: string
        new_status:
          type: string
        previous_is_active:
          type: boolean
        new_is_active:
          type: boolean
        reason_code:
          type: string
        note:
          type: string
        evidence_summary:
          type: string
        clean_account_confirmed:
          type: boolean
        changed_at:
          type: string
          format: date-time
      required:
      - actor_account_type
      - actor_user_id
      - changed_at
      - clean_account_confirmed
      - evidence_summary
      - id
      - new_is_active
      - new_status
      - note
      - previous_is_active
      - previous_status
      - reason_code
      - user_id
    ActionEnum:
      enum:
      - withdrawal
      - bank_account_change
      - fx
      - primary_investment
      - secondary_market_listing
      - secondary_market_purchase
      - pin_setup
      - pin_change
      - pin_reset
      type: string
      description: |-
        * `withdrawal` - withdrawal
        * `bank_account_change` - bank_account_change
        * `fx` - fx
        * `primary_investment` - primary_investment
        * `secondary_market_listing` - secondary_market_listing
        * `secondary_market_purchase` - secondary_market_purchase
        * `pin_setup` - pin_setup
        * `pin_change` - pin_change
        * `pin_reset` - pin_reset
    ActivityEntry:
      type: object
      properties:
        archived_at:
          type: string
          format: date-time
        id:
          type: string
        activity_type:
          type: string
        occurred_at:
          type: string
          format: date-time
        direction:
          type: string
        title:
          type: string
        amount_minor:
          type: integer
          nullable: true
        currency:
          type: string
        status:
          type: string
        loan_id:
          type: string
          format: uuid
          nullable: true
        loan_title:
          type: string
        metadata: {}
      required:
      - activity_type
      - amount_minor
      - currency
      - direction
      - id
      - loan_title
      - metadata
      - occurred_at
      - status
      - title
    AdminDashboardCurrencySummary:
      type: object
      properties:
        currency:
          type: string
        available_balance_minor:
          type: integer
        investable_available_minor:
          type: integer
        withdraw_only_available_minor:
          type: integer
        overdue_available_minor:
          type: integer
        frozen_available_minor:
          type: integer
        penalty_mode_available_minor:
          type: integer
        pending_withdrawal_minor:
          type: integer
        forced_withdrawal_minor:
          type: integer
        pending_bank_operation_minor:
          type: integer
        fx_unsettled_sold_minor:
          type: integer
        fx_unsettled_bought_minor:
          type: integer
        fx_unsettled_fee_minor:
          type: integer
      required:
      - available_balance_minor
      - currency
      - forced_withdrawal_minor
      - frozen_available_minor
      - fx_unsettled_bought_minor
      - fx_unsettled_fee_minor
      - fx_unsettled_sold_minor
      - investable_available_minor
      - overdue_available_minor
      - penalty_mode_available_minor
      - pending_bank_operation_minor
      - pending_withdrawal_minor
      - withdraw_only_available_minor
    AdminDashboardQueueItem:
      type: object
      properties:
        kind:
          type: string
        id:
          type: string
        title:
          type: string
        status:
          type: string
        priority:
          type: string
        due_at:
          type: string
          format: date-time
          nullable: true
        due_date:
          type: string
          format: date
          nullable: true
        currency:
          type: string
        amount_minor:
          type: integer
          nullable: true
        object_type:
          type: string
        object_id:
          type: string
        metadata: {}
      required:
      - amount_minor
      - currency
      - due_at
      - due_date
      - id
      - kind
      - metadata
      - object_id
      - object_type
      - priority
      - status
      - title
    AdminDashboardQueues:
      type: object
      properties:
        admin_tasks:
          type: array
          items:
            $ref: '#/components/schemas/AdminDashboardQueueItem'
        kyc_reviews:
          type: array
          items:
            $ref: '#/components/schemas/AdminDashboardQueueItem'
        bank_operations_pending:
          type: array
          items:
            $ref: '#/components/schemas/AdminDashboardQueueItem'
        withdrawals_requested:
          type: array
          items:
            $ref: '#/components/schemas/AdminDashboardQueueItem'
        forced_withdrawals_requested:
          type: array
          items:
            $ref: '#/components/schemas/AdminDashboardQueueItem'
        balance_ageing_actions:
          type: array
          items:
            $ref: '#/components/schemas/AdminDashboardQueueItem'
        funding_loans:
          type: array
          items:
            $ref: '#/components/schemas/AdminDashboardQueueItem'
        servicing_due:
          type: array
          items:
            $ref: '#/components/schemas/AdminDashboardQueueItem'
        loan_risk:
          type: array
          items:
            $ref: '#/components/schemas/AdminDashboardQueueItem'
        secondary_listing_approvals:
          type: array
          items:
            $ref: '#/components/schemas/AdminDashboardQueueItem'
        fx_settlement_deltas:
          type: array
          items:
            $ref: '#/components/schemas/AdminDashboardQueueItem'
        failed_emails:
          type: array
          items:
            $ref: '#/components/schemas/AdminDashboardQueueItem'
        reconciliation_breaks:
          type: array
          items:
            $ref: '#/components/schemas/AdminDashboardQueueItem'
      required:
      - admin_tasks
      - balance_ageing_actions
      - bank_operations_pending
      - failed_emails
      - forced_withdrawals_requested
      - funding_loans
      - fx_settlement_deltas
      - kyc_reviews
      - loan_risk
      - reconciliation_breaks
      - secondary_listing_approvals
      - servicing_due
      - withdrawals_requested
    AdminLoginConfirmRequest:
      type: object
      properties:
        code_id:
          type: string
          format: uuid
        code:
          type: string
          pattern: ^\d{6}$
      required:
      - code
      - code_id
    AdminLoginStartRequest:
      type: object
      properties:
        email:
          type: string
