        currency:
          type: string
        total_available_minor:
          type: integer
        investable_minor:
          type: integer
          description: Potentially investable balance; each loan's remaining funding
            window is checked separately.
        withdraw_only_minor:
          type: integer
          description: 'Balance on its last day (day 58 by default): it can only be
            withdrawn.'
        overdue_minor:
          type: integer
          description: Balance due back to the investor's bank (from the day after
            the last day) that is not returned yet, usually because no verified payout
            IBAN is known.
        frozen_minor:
          type: integer
        penalty_mode_minor:
          type: integer
          description: 'Remaining balance of lots in penalty mode: blocked until withdrawn.'
        penalty_charged_minor:
          type: integer
          description: Balance-ageing penalties charged so far on this currency's
            lots; already deducted and not included in any balance figure.
        lot_count:
          type: integer
        active_lot_count:
          type: integer
        next_investment_deadline_at:
          type: string
          format: date-time
          nullable: true
          description: Compatibility alias of the next source holding deadline.
        next_withdrawal_deadline_at:
          type: string
          format: date-time
          nullable: true
        next_return_date:
          type: string
          format: date
          nullable: true
          description: Next Europe/Zurich date on which money of this currency that
            is still not invested goes back to the investor's bank (money already
            due back is in overdue_minor).
      required:
      - active_lot_count
      - currency
      - frozen_minor
      - investable_minor
      - investor_user_id
      - lot_count
      - next_investment_deadline_at
      - next_return_date
      - next_withdrawal_deadline_at
      - overdue_minor
      - penalty_charged_minor
      - penalty_mode_minor
      - total_available_minor
      - withdraw_only_minor
