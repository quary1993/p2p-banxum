name: Rebuild staging QA seed

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type REBUILD STAGING QA SEED.
        required: true
        type: string
      encrypted_seed_payload:
        description: Encrypted actor and regression-account payload from the deployment helper.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: banxum-deployment
  cancel-in-progress: false

jobs:
  rebuild:
    name: Rebuild current-schema staging seed
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate request and configuration
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          SSH_HOST: ${{ secrets.BANXUM_SSH_HOST }}
          SSH_USER: ${{ secrets.BANXUM_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.BANXUM_SSH_PRIVATE_KEY }}
          ENCRYPTED_SEED_PAYLOAD: ${{ inputs.encrypted_seed_payload }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "REBUILD STAGING QA SEED"
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$ENCRYPTED_SEED_PAYLOAD"

      - name: Prepare private maintenance inputs
        env:
          SSH_PRIVATE_KEY: ${{ secrets.BANXUM_SSH_PRIVATE_KEY }}
          ENCRYPTED_SEED_PAYLOAD: ${{ inputs.encrypted_seed_payload }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/banxum_deploy_key"
          printf 'Deployment key fingerprint: '
          ssh-keygen -y -f "$HOME/.ssh/banxum_deploy_key" | ssh-keygen -lf -
          printf 'Deployment public key: %s\n' "$(ssh-keygen -y -f "$HOME/.ssh/banxum_deploy_key")"
          QA_SEED_PASSPHRASE="$(sed '/^[[:space:]]*$/d' "$HOME/.ssh/banxum_deploy_key")"
          export QA_SEED_PASSPHRASE
          printf '%s' "$ENCRYPTED_SEED_PAYLOAD" | openssl enc -d -aes-256-cbc \
            -a -A -pbkdf2 -iter 200000 -pass env:QA_SEED_PASSPHRASE \
            > "$RUNNER_TEMP/qa-seed-payload.json"
          python3 - \
            "$RUNNER_TEMP/qa-seed-payload.json" \
            "$RUNNER_TEMP/qa-reset-actor" \
            "$RUNNER_TEMP/qa-regression-accounts.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          with open(sys.argv[1], encoding="utf-8") as stream:
              payload = json.load(stream)
          if set(payload) != {"actor_email", "accounts"}:
              raise SystemExit("Invalid QA seed payload.")
          actor_email = payload["actor_email"]
          values = payload["accounts"]
          required = {"admin", "user1", "user2", "user3"}
          if not isinstance(actor_email, str) or "@" not in actor_email:
              raise SystemExit("Invalid QA reset actor.")
          if not isinstance(values, dict) or set(values) != required or not all(
              isinstance(value, str) and "@" in value for value in values.values()
          ):
              raise SystemExit("Invalid QA regression account mapping.")
          Path(sys.argv[2]).write_text(f"{actor_email}\n", encoding="utf-8")
          Path(sys.argv[3]).write_text(
              json.dumps(values, separators=(",", ":")), encoding="utf-8"
          )
          PY

      - name: Trust deployment host
        env:
          SSH_HOST: ${{ secrets.BANXUM_SSH_HOST }}
          SSH_PORT: ${{ secrets.BANXUM_SSH_PORT || '22' }}
        run: ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Rebuild and verify staging seed
        env:
          SSH_HOST: ${{ secrets.BANXUM_SSH_HOST }}
          SSH_USER: ${{ secrets.BANXUM_SSH_USER }}
          SSH_PORT: ${{ secrets.BANXUM_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          remote_accounts="/tmp/banxum-qa-accounts-${GITHUB_RUN_ID}.json"
          remote_actor="/tmp/banxum-qa-actor-${GITHUB_RUN_ID}"
          scp -i "$HOME/.ssh/banxum_deploy_key" -P "$SSH_PORT" -o BatchMode=yes \
            "$RUNNER_TEMP/qa-regression-accounts.json" \
            "$SSH_USER@$SSH_HOST:$remote_accounts"
          scp -i "$HOME/.ssh/banxum_deploy_key" -P "$SSH_PORT" -o BatchMode=yes \
            "$RUNNER_TEMP/qa-reset-actor" \
            "$SSH_USER@$SSH_HOST:$remote_actor"
          ssh -i "$HOME/.ssh/banxum_deploy_key" -p "$SSH_PORT" -o BatchMode=yes \
            -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" \
            REMOTE_ACCOUNTS="$remote_accounts" REMOTE_ACTOR="$remote_actor" 'bash -s' <<'REMOTE'
          set -euo pipefail
          trap 'rm -f "$REMOTE_ACCOUNTS" "$REMOTE_ACTOR"' EXIT
          chmod 600 "$REMOTE_ACCOUNTS" "$REMOTE_ACTOR"
          actor_email="$(cat "$REMOTE_ACTOR")"
          cd /opt/banxum/staging/app
          python3 infra/deploy/reset_qa_environment.py \
            --environment staging \
            --regression-accounts "$REMOTE_ACCOUNTS" \
            --create-missing-investors
          run_id="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          python3 infra/deploy/reset_qa_environment.py \
            --environment staging \
            --execute \
            --regression-accounts "$REMOTE_ACCOUNTS" \
            --create-missing-investors \
            --actor-email "$actor_email" \
            --run-id "$run_id" \
            --confirm "RESET QA DATA staging https://staging.nxnarena.com"
          REMOTE
