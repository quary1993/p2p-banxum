    PublicProjectRecord:
      type: object
      properties:
        installments_total:
          type: integer
          description: 'Installments of the repayment schedule (for a Loan Originator
            claim: the installments after the investors'' entitlement start).'
        installments_paid:
          type: integer
          description: Installments paid in full.
        principal_repaid_minor:
          type: integer
          description: Principal repaid to investors so far, in minor units.
        interest_paid_minor:
          type: integer
          description: Interest paid to investors so far, in minor units.
        outstanding_principal_minor:
          type: integer
          description: 'Principal not repaid yet (loan amount minus principal repaid),
            in minor units. For a loan in default: outstanding at default, before
            recovery.'
        days_past_due:
          type: integer
          description: Days past the due date of the oldest unpaid installment; 0
            unless late or in default.
        defaulted_on:
          type: string
          format: date
          nullable: true
          description: Date the loan went into default; null unless in default.
        public_note:
          type: string
          description: Text of the latest public loan note by Garanta, or empty.
      required:
      - days_past_due
      - defaulted_on
      - installments_paid
      - installments_total
      - interest_paid_minor
      - outstanding_principal_minor
      - principal_repaid_minor
      - public_note
