<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register · Banxum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="auth-wrap">
<a class="brand" href="index.html" aria-label="Banxum home"><span class="brand-word"><span>Ban</span><span class="x"><svg width="12.8" height="12.8" viewBox="0 0 56 56" fill="#151719"><path d="M0,0 L15.5,0 L28,17.284 L20.25,28 Z"></path><path d="M40.5,0 L56,0 L35.75,28 L28,17.284 Z"></path><path d="M35.75,28 L56,56 L40.5,56 L28,38.716 Z"></path><path d="M20.25,28 L28,38.716 L15.5,56 L0,56 Z"></path></svg></span><span>um</span></span>
<svg width="14" height="14" viewBox="0 0 32 32" aria-label="Switzerland"><rect width="32" height="32" fill="#D8232A"></rect><path d="M13,6 h6 v7 h7 v6 h-7 v7 h-6 v-7 h-7 v-6 h7 Z" fill="#FFFFFF"></path></svg></a>
<div class="auth-card wide">
<div style="display:flex;align-items:center;gap:7px;margin-bottom:14px">
<span style="width:22px;height:4px;border-radius:2px;background:#151719"></span>
<span style="width:22px;height:4px;border-radius:2px;background:#DDE3E1"></span>
<span style="width:22px;height:4px;border-radius:2px;background:#DDE3E1"></span>
<span style="margin-left:8px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#626B70">Step 1 of 3</span>
</div>
<h2 style="margin:0 0 4px;font-size:22px;font-weight:600;letter-spacing:-0.03em">Create your lender account</h2>
<p style="margin:0 0 22px;font-size:13.5px;line-height:1.55;color:#626B70;text-wrap:pretty">Individual lenders in Switzerland or the EU/EEA only. Nothing is invested, and nothing can be, until your identity is verified.</p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div class="field"><label for="reg-first">First name</label><input id="reg-first" value="Andrea"></div>
<div class="field"><label for="reg-last">Last name</label><input id="reg-last" value="Keller"></div>
</div>
<div class="field"><label for="reg-email">Email address</label><input id="reg-email" type="email" value="a.keller@bluewin.ch"></div>
<div class="field">
<label for="reg-phone">Mobile phone</label>
<div style="display:flex;gap:8px">
<select aria-label="Phone country prefix" style="width:110px;flex:none;padding:11px 10px;border:1px solid #C2BFB5;border-radius:6px;background:#FBFAF7">
<option selected>CH +41</option><option>AT +43</option><option>DE +49</option><option>FR +33</option><option>IT +39</option><option>LI +423</option><option>RO +40</option>
</select>
<input id="reg-phone" inputmode="tel" value="79 000 00 63" style="flex:1;padding:11px 14px;border:1px solid #C2BFB5;border-radius:6px;background:#FBFAF7;outline:none;font-size:14.5px">
</div>
</div>
<div class="field">
<label for="reg-country">Country of residence</label>
<select id="reg-country">
<option selected>Switzerland</option><option>Austria</option><option>France</option><option>Germany</option><option>Italy</option><option>Liechtenstein</option><option>Netherlands</option><option>Romania</option><option>Spain</option><option>Sweden</option>
</select>
</div>
<div style="display:flex;flex-direction:column;gap:10px;margin:6px 0 0">
<label class="check" for="reg-terms"><input id="reg-terms" type="checkbox"><span>I accept the <a href="#" style="font-weight:600;border-bottom:1px solid currentColor">platform agreement and fee schedule</a>. Acceptance is recorded with document version and timestamp.</span></label>
<label class="check" for="reg-risk"><input id="reg-risk" type="checkbox"><span>I have read the <a href="#" style="font-weight:600;border-bottom:1px solid currentColor">risk acknowledgement</a> — I can lose money, and there is no deposit protection.</span></label>
</div>
<a class="btn dark" style="display:flex;width:100%;margin-top:20px" href="verification.html">Continue</a>
</div>
<a class="auth-foot" href="index.html">← Back to the loan preview</a>
</div>
<script src="app.js"></script>
</body>
</html>
