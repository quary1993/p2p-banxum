name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: banxum
          POSTGRES_USER: banxum
          POSTGRES_PASSWORD: banxum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U banxum -d banxum"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://banxum:banxum@localhost:5432/banxum
      MIGRATION_CHECK_DATABASE_URL: postgres://banxum:banxum@localhost:5432/banxum
      POSTGRES_TEST_DATABASE_URL: postgres://banxum:banxum@localhost:5432/banxum
      REDIS_URL: redis://localhost:6379/0
      CACHE_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: unsafe-ci-key
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install backend dependencies
        run: uv sync --python 3.12 --group dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Agent handoff checks
        run: make agent-check

      - name: Postgres hardening tests
        run: make test-postgres-hardening

      - name: Backend dependency audit
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --strict --disable-pip --no-deps -r "$RUNNER_TEMP/requirements.txt"

      - name: Frontend dependency audit
        run: npm --prefix frontend audit --omit=dev

      - name: Deploy settings check (staging-like environment)
        # The deploy containers run the same check before they start (audit A-51).
        run: |
          export ENVIRONMENT=staging
          export DJANGO_DEBUG=false
          export DJANGO_SECRET_KEY="$(uv run python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          export AUTH_DELIVERY_SECRET_ENCRYPTION_KEY="$(uv run python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          export AUTH_SECRET_DIGEST_PEPPER="$(uv run python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          export TRUSTED_PROXY_COUNT=2
          export SCHEDULED_JOBS_ACTOR_EMAIL=scheduler@example.test
          export PHONE_VERIFICATION_PROVIDER=twilio_verify
          export TWILIO_API_KEY_SID=SKci TWILIO_API_KEY_SECRET=ci-secret TWILIO_VERIFY_SERVICE_SID=VAci
          export COMMUNICATIONS_EMAIL_PROVIDER=twilio_email
          export TWILIO_EMAIL_API_KEY_SID=SKci TWILIO_EMAIL_API_KEY_SECRET=ci-secret
          export DIDIT_SESSION_PROVIDER=api DIDIT_API_KEY=ci-key DIDIT_WEBHOOK_SECRET=ci-secret
          export DIDIT_WORKFLOW_ID=00000000-0000-0000-0000-000000000000
          export DIDIT_WEBHOOK_REQUIRE_SIGNATURE=true
          export FX_RATE_PROVIDER=yahoo_finance
          uv run python backend/manage.py check --deploy --fail-level ERROR

      - name: Docker build
        run: make docker-build
