services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # The backend runs as the unprivileged user 10001 (audit A-55). Media written by
  # older root-run containers is handed over to that user before every start.
  media-permissions:
    image: busybox:1.36
    user: "0:0"
    command: ["chown", "-R", "10001:10001", "/media"]
    volumes:
      - media_data:/media
    restart: "no"

  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile.deploy
    restart: unless-stopped
    env_file:
      - ${BANXUM_BACKEND_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/0
      DJANGO_STATIC_ROOT: /app/staticfiles
      DJANGO_MEDIA_ROOT: /app/backend/media
      # Caddy (TLS edge) -> nginx (frontend container) -> backend: two proxies add
      # X-Forwarded-For entries; TLS ends at Caddy (audit A-48 / A-51).
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-2}
      DJANGO_USE_X_FORWARDED_PROTO: "true"
    # "check --deploy" runs first: the container does not start with unsafe settings
    # or missing provider configuration (audit A-51).
    command: sh -c ".venv/bin/python backend/manage.py check --deploy --fail-level ERROR && .venv/bin/python backend/manage.py migrate --noinput && .venv/bin/python backend/manage.py collectstatic --noinput && .venv/bin/python backend/manage.py seed_reference_data && .venv/bin/python backend/manage.py bootstrap_superadmin && exec .venv/bin/gunicorn backend.config.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-2} --timeout ${GUNICORN_TIMEOUT:-60}"
    volumes:
      - media_data:/app/backend/media
    depends_on:
      media-permissions:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile.deploy
      args:
        VITE_PLATFORM_BRAND_NAME: ${PLATFORM_BRAND_NAME:-BANXUM}
        VITE_LEGAL_OPERATOR_NAME: ${LEGAL_OPERATOR_NAME:-Garanta Finanzgruppe AG}
        VITE_SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@banxum.com}
    restart: unless-stopped
    ports:
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${PUBLIC_HTTP_PORT}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  media_data:
