# BANXUM security headers for the single-page app (audit A-54).
# IP of Webby-Soft SRL.
#
# Included by every nginx location that serves the app. nginx drops server-level
# add_header lines in a location that has its own add_header, so the set lives here.
# API responses get their headers from Django; HSTS is set at the TLS edge (Caddy).
#
# CSP: the build loads scripts, styles, fonts and images from its own origin only.
# 'unsafe-inline' in style-src covers React style attributes; no inline scripts.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
# Login links carry their token in the URL fragment; never send page URLs onwards.
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-BANXUM-Software-IP "IP of Webby-Soft SRL." always;
add_header X-BANXUM-Build-Origin "ATEW5bUMtfGj80bXzkGFbtEIwTx0cb6Qig3qkx90kV_Srfdc012ga6e8Ddq5v4qj1nbItbZAfx4ZDA==" always;
