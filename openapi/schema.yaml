    PublicProject:
      type: object
      description: A loan on the public site. Never carries the borrower's name or
        identifiers.
      properties:
        loan_id:
          type: string
          format: uuid
          description: Public id for the project page link.
        title:
          type: string
          description: Loan title (never the borrower's name).
        product_type:
          allOf:
          - $ref: '#/components/schemas/ProductTypeEnum'
          description: |-
            A BANXUM Direct loan or a Loan Originator claim.

            * `direct` - direct
            * `originator_claim` - originator_claim
        is_refinancing:
          type: boolean
          description: 'Loan type: new or refinancing.'
        public_status:
          allOf:
          - $ref: '#/components/schemas/PublicStatusEnum'
          description: |-
            coming_soon: shown before it opens, nothing can be invested yet (U33-DEC-17); open: published, capacity left, round still taking orders; fully_funded: nothing left to invest, round not closed yet; repaying: funded or active; late; repaid; default: defaulted or written off.

            * `coming_soon` - coming_soon
            * `open` - open
            * `fully_funded` - fully_funded
            * `repaying` - repaying
            * `late` - late
            * `repaid` - repaid
            * `default` - default
        currency:
          type: string
          description: ISO currency code (CHF or EUR).
        principal_minor:
          type: integer
          description: 'Loan amount offered to investors, in minor units: the final
            principal after a partial close; for a Loan Originator claim the principal
            offered in (or subscribed at the close of) its round.'
        committed_principal_minor:
          type: integer
          description: Funded so far, in minor units (equal to the principal once
            funded).
        remaining_capacity_minor:
          type: integer
          description: Amount still open for investment, in minor units; 0 unless
            open.
        minimum_investment_minor:
          type: integer
          nullable: true
          description: What a new investor must invest now (the loan minimum, capped
            by the remaining capacity; for a Swiss-borrower loan raised so the places
            left can fill the loan), in minor units; null unless open, and null when
            a Swiss-borrower loan has no place left.
        investors_count:
          type: integer
          description: 'Distinct investors: current (not transferred) holders and
            investors with money allocated to the funding round.'
        max_investors:
          type: integer
          nullable: true
          description: Most investors this loan may have (Swiss borrower, platform
            setting, default 20); null when no limit applies.
        places_left:
          type: integer
          nullable: true
          description: Places left for new investors (max_investors - investors_count,
            never below 0); null when no limit applies.
        interest_rate_bps:
          type: integer
          description: Investor interest per year in basis points (the investor marketplace
            yield).
        term_months:
          type: integer
          description: Loan period in months.
        repayment_type:
          type: string
          description: RepaymentType value.
        collateral_type:
          type: string
          description: CollateralType value.
        collateral_description:
          type: string
        ltv_bps:
          type: integer
          nullable: true
          description: Loan-to-value in basis points; null without a collateral value.
        purpose:
          type: string
          description: LoanPurpose value.
        purpose_description:
          type: string
        investor_summary:
          type: string
        borrower_country:
          type: string
          description: Borrower country as ISO 3166-1 alpha-2 when known, else empty.
        borrower_sector:
          type: string
          description: Borrower business classification when it is marked public,
            else empty.
        borrower_year_founded:
          type: integer
          nullable: true
        originator:
          allOf:
          - $ref: '#/components/schemas/PublicProjectOriginator'
          nullable: true
          description: The Loan Originator of a claim; null for a Direct loan.
        published_at:
          type: string
          format: date-time
          nullable: true
        funding_deadline:
          type: string
          format: date
          nullable: true
        funded_at:
          type: string
          format: date
          nullable: true
          description: Funding close date; null while the round is running.
        planned_opening_date:
          type: string
          format: date
          nullable: true
          description: Planned opening date of a coming_soon project; null otherwise.
        record:
          allOf:
          - $ref: '#/components/schemas/PublicProjectRecord'
          nullable: true
          description: Repayment record; only for repaying, late, repaid and default
            loans.
      required:
      - borrower_country
      - borrower_sector
      - borrower_year_founded
      - collateral_description
      - collateral_type
      - committed_principal_minor
      - currency
      - funded_at
      - funding_deadline
      - interest_rate_bps
      - investor_summary
      - investors_count
      - is_refinancing
      - loan_id
      - ltv_bps
      - max_investors
      - minimum_investment_minor
      - originator
      - places_left
      - principal_minor
      - product_type
      - public_status
      - published_at
      - purpose
      - purpose_description
      - record
      - remaining_capacity_minor
      - repayment_type
      - term_months
      - title
    PublicProjectOriginator:
      type: object
      properties:
        id:
          type: string
